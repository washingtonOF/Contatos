name: IsaMig Mensagens Android

on:
  push:
    branches: [feat/conecta-familia-android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Preparar assinatura de teste
        env:
          CONECTA_DEBUG_KEYSTORE_BASE64: ${{ secrets.CONECTA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$CONECTA_DEBUG_KEYSTORE_BASE64" ]]; then
            signing_directory="$ANDROID_USER_HOME"
            if [[ -z "$signing_directory" ]]; then
              signing_directory=~/.android
            fi
            mkdir -p "$signing_directory"
            umask 077
            printf '%s' "$CONECTA_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$signing_directory/debug.keystore"
          fi
      - name: Instalar dependências e testar
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Compilar APK de teste
        env:
          CONECTA_ANDROID_API_KEY: ${{ vars.CONECTA_ANDROID_API_KEY }}
          CONECTA_ANDROID_APP_ID: ${{ vars.CONECTA_ANDROID_APP_ID }}
          CONECTA_CALL_BASE_URL: ${{ vars.CONECTA_CALL_BASE_URL }}
        run: |
          if [[ -z "$CONECTA_ANDROID_API_KEY" || -z "$CONECTA_ANDROID_APP_ID" ]]; then
            echo '::notice::APK de validação. Configure as variáveis do Firebase para habilitar o login.'
          fi
          flutter build apk --debug --no-pub \
            --dart-define="CONECTA_ANDROID_API_KEY=$CONECTA_ANDROID_API_KEY" \
            --dart-define="CONECTA_ANDROID_APP_ID=$CONECTA_ANDROID_APP_ID" \
            --dart-define="CONECTA_CALL_BASE_URL=$CONECTA_CALL_BASE_URL"
      - name: Registrar assinaturas do APK
        run: |
          apk=build/app/outputs/flutter-apk/app-debug.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk" | tee build/app/outputs/flutter-apk/assinatura.txt
          cat build/app/outputs/flutter-apk/assinatura.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: conecta-familia-apk-teste
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/assinatura.txt
          if-no-files-found: error
          retention-days: 14
