name: IsaMig Família - APK Google Login
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verificar configuração de assinatura persistente
        env:
          DEBUG_KEYSTORE: ${{ secrets.CONECTA_DEBUG_KEYSTORE_BASE64 }}
          FIREBASE_API_KEY: ${{ vars.CONECTA_ANDROID_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.CONECTA_ANDROID_APP_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          test -n "$DEBUG_KEYSTORE" || { echo "::error::Configure CONECTA_DEBUG_KEYSTORE_BASE64 em Actions Secrets."; exit 1; }
          test -n "$FIREBASE_API_KEY" || { echo "::error::Configure CONECTA_ANDROID_API_KEY em Actions Variables."; exit 1; }
          test -n "$FIREBASE_APP_ID" || { echo "::error::Configure CONECTA_ANDROID_APP_ID em Actions Variables."; exit 1; }
          test -n "$GOOGLE_WEB_CLIENT_ID" || { echo "::error::Configure GOOGLE_WEB_CLIENT_ID em Actions Variables."; exit 1; }
          mkdir -p "$HOME/.android"
          umask 077
          printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Instalar dependências e validar Flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Compilar APK de teste com Google Sign-In
        env:
          FIREBASE_API_KEY: ${{ vars.CONECTA_ANDROID_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.CONECTA_ANDROID_APP_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          flutter build apk --debug \
            --dart-define=CONECTA_ANDROID_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=CONECTA_ANDROID_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
      - name: Conferir assinatura do APK
        run: |
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk" | tee build/app/outputs/flutter-apk/assinatura.txt
      - uses: actions/upload-artifact@v4
        with:
          name: isamig-familia-google-login-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/assinatura.txt
          if-no-files-found: error
          retention-days: 7
