name: Validar Conecta Flutter

on:
  push:
    branches: [main, feat/auth-ui, feat/master-panel, feat/master-spark]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar estrutura Web
        run: flutter create --platforms=web --project-name conecta_messenger .
      - name: Instalar dependencias
        run: flutter pub get
      - name: Analisar codigo
        run: flutter analyze
      - name: Testar widgets
        run: flutter test
      - name: Compilar Web
        run: flutter build web --release
