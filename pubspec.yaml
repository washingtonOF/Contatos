name: conecta_messenger
description: Conecta - prototipo multiplataforma
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  firebase_storage: ^12.4.10
  cloud_firestore: ^5.6.12
  file_picker: ^10.3.10
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  video_player: ^2.10.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/isamig/logo.png
    - assets/isamig/dm-sans-OFL.txt
    - assets/isamig/manrope-OFL.txt
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/isamig/dm-sans.ttf
    - family: Manrope
      fonts:
        - asset: assets/isamig/manrope.ttf
